name: Prueba Token Local vs Secret

on:
  push:
    branches: [ "**" ]

jobs:
  comparar-tokens:
    runs-on: self-hosted
    
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Comparar DEV_TOKEN contra LOCAL_DEV_TOKEN
        shell: pwsh
        run: |
          Write-Host "Comparando el secret de GitHub con la variable local..."
          
          $secretVal = "${{ secrets.DEV_TOKEN }}"
          $localVal = $env:LOCAL_DEV_TOKEN
          
          if ($secretVal -eq $localVal) {
              Write-Host "✅ ÉXITO: Los tokens coinciden perfectamente." -ForegroundColor Green
              exit 0
          } else {
              Write-Host "❌ ERROR: Los tokens NO coinciden." -ForegroundColor Red
              exit 1
          }