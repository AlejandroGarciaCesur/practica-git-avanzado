name: CI Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Simular actualización de README
        run: |
          echo "Añadida feature en PR: ${{ github.head_ref || github.ref_name }}" >> README.md
          cat README.md

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    env:
      TOKEN: ${{ secrets.DEV_TOKEN }}
    steps:
      - name: Validar Secret DEV contra variable local
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Coinciden DEV ✅"
          } else {
            Write-Host "No coinciden DEV ❌"
            exit 1
          }