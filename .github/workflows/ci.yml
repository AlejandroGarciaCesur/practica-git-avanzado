name: CI Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Actualizar README con la feature
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Usar la rama de origen del PR si existe, si no la rama actual
          TARGET_BRANCH="${{ github.head_ref }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          
          echo "Rama detectada para actualizar: $TARGET_BRANCH"
          
          # Añadir la línea de la feature como pide la práctica[cite: 9]
          echo "Añadida feature: $TARGET_BRANCH" >> README.md
          
          # Si estamos en develop o main, no se hace push. Si es la feature, se hace push.
          if [ "$TARGET_BRANCH" = "develop" ] || [ "$TARGET_BRANCH" = "main" ]; then
            echo "Ejecución en rama protegida ($TARGET_BRANCH). Se omite el git push."
          else
            echo "Haciendo push en la rama de feature: $TARGET_BRANCH"
            git add README.md
            git commit -m "Actualizar README automáticamente con la nueva feature" || echo "No hay cambios para commit"
            git push origin HEAD:$TARGET_BRANCH
          fi

validate-dev:
    needs: update-readme
    runs-on: self-hosted
    env:
      TOKEN: ${{ secrets.DEV_TOKEN }}
    steps:
      - name: Validar Secret DEV contra variable local
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Coinciden DEV ✅"
          } else {
            Write-Host "No coinciden DEV ❌"
            exit 1
          }