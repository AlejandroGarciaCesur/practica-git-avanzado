name: CI Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }} # Forzar el checkout en la rama correcta

      - name: Actualizar README con la feature
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Detectar la rama actual de forma exacta mediante Git
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Rama actual detectada: $CURRENT_BRANCH"
          
          # Añadir la línea al README.md
          echo "Añadida feature: $CURRENT_BRANCH" >> README.md
          
          # Si estamos en develop o main, no se hace push. Si es una feature, se hace push automático.
          if [ "$CURRENT_BRANCH" = "develop" ] || [ "$CURRENT_BRANCH" = "main" ]; then
            echo "Ejecución en rama protegida ($CURRENT_BRANCH). Se omite el git push."
          else
            echo "Haciendo push en la rama de feature: $CURRENT_BRANCH"
            git add README.md
            git commit -m "Actualizar README automáticamente con la nueva feature" || echo "No hay cambios para commit"
            git push origin HEAD:$CURRENT_BRANCH
          fi

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    env:
      TOKEN: ${{ secrets.DEV_TOKEN }}
    steps:
      - name: Validar Secret DEV contra variable local
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Coinciden DEV ✅"
          } else {
            Write-Host "No coinciden DEV ❌"
            exit 1
          }