name: CI Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Actualizar README con la feature
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Priorizar la rama de origen del PR
          TARGET_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          if [ -z "$TARGET_BRANCH" ]; then
            echo "No estamos en un Pull Request. Se omite el git push a la rama protegida."
            echo "Añadida feature: ${{ github.ref_name }}" >> README.md
          else
            echo "Actualizando README en la rama del PR: $TARGET_BRANCH"
            echo "Añadida feature: $TARGET_BRANCH" >> README.md
            git add README.md
            git commit -m "Actualizar README automáticamente con la nueva feature" || echo "No hay cambios para commit"
            git push origin HEAD:$TARGET_BRANCH
          fi

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    env:
      TOKEN: ${{ secrets.DEV_TOKEN }}
    steps:
      - name: Validar Secret DEV contra variable local
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Coinciden DEV ✅"
          } else {
            Write-Host "No coinciden DEV ❌"
            exit 1
          }