name: CD Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <-- Necesario para poder hacer push al repositorio
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Incrementar version en README
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          echo "AppVersion-1 ($TIMESTAMP)" >> README.md
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Bump version de produccion a AppVersion-1" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    env:
      TOKEN_PROD: ${{ secrets.PROD_TOKEN }}
    steps:
      - name: Validar Secret PROD contra variable local
        run: |
          if ($env:TOKEN_PROD -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Coinciden PROD ✅"
          } else {
            Write-Host "No coinciden PROD ❌"
            exit 1
          }