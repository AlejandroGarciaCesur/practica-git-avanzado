name: CD Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Simular incremento de versión
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          echo "AppVersion-1 ($TIMESTAMP)" >> README.md
          cat README.md

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    env:
      TOKEN_PROD: ${{ secrets.PROD_TOKEN }}
    steps:
      - name: Validar Secret PROD contra variable local
        run: |
          if ($env:TOKEN_PROD -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Coinciden PROD ✅"
          } else {
            Write-Host "No coinciden PROD ❌"
            exit 1
          }