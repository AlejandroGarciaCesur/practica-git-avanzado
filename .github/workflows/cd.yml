name: CD Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Otorga permisos de escritura
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Incrementar version en README
        run: |
          # Configurar identidad del bot de Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Incrementar la version con timestamp
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          echo "AppVersion-1 ($TIMESTAMP)" >> README.md
          
          # Hacer commit y push a la rama
          git add README.md
          git commit -m "Bump version de produccion a AppVersion-1" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    env:
      TOKEN_PROD: ${{ secrets.PROD_TOKEN }}
    steps:
      - name: Validar Secret PROD contra variable local
        run: |
          if ($env:TOKEN_PROD -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Coinciden PROD ✅"
          } else {
            Write-Host "No coinciden PROD ❌"
            exit 1
          }